name: Test and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer transaction regressions
        run: python -m unittest discover -s tests -v
      - name: Data export regressions
        run: python -m unittest discover -s analysis -p "test_*.py" -v
      - name: Verify payload hashes
        run: python tools/release.py verify
      - name: Install packaging tool
        run: python -m pip install pyinstaller==6.22.3
      - name: Build release ZIP
        run: python tools/release.py build
      - uses: actions/upload-artifact@v4
        with:
          name: GambleChoice-Windows
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" dist/*.zip dist/*.sha256 --clobber
          } else {
            gh release create "${{ github.ref_name }}" dist/*.zip dist/*.sha256 --title "GambleChoice ${{ github.ref_name }}" --generate-notes --prerelease
          }
